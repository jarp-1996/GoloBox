<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'Poppins', 'sans-serif'],

        fontSize: {

          'body': '1.125rem',
          'caption': '0.875rem',

</script>
<style>
  @keyframes marquee-left {
    0% { transform: translateX(0%); }

    animation: marquee-left 30s linear infinite;
  }
</style>
